<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B211B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}html{height:100%;box-sizing:border-box}</style>
</head>
<body>
<title>Soroban de Bolso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@700&display=swap">
<style>
/* Layout: app de uma tela — cabeçalho curto, área rolável no meio, barra de abas embaixo; coluna única de até 560px.
   Deitado (classe html.land, calculada em JS): abas na lateral, conta à esquerda e soroban à direita.
   Identidade: madeira escura do soroban + índigo (aizome) como ação; cada unidade da trilha tem um matiz (--h). */
:root{
  --bg:#ECEEF2; --surface:#FFFFFF; --ink:#161B26; --muted:#596277; --line:#D6DBE4; --line-2:#BCC3CF;
  --accent:#2E4A7D; --accent-ink:#FFFFFF; --accent-soft:#DDE4F1;
  --ok:#2D7A4E; --ok-soft:#DCEFE3; --bad:#B03F2C; --bad-soft:#F6E0DB;
  --frame:#2B211B; --frame-hi:#463529; --rod:#C9C1B3; --bead:#6E4025; --bead-hi:#B07444; --beam:#E9E2D4;
  --mark:#E8B64C; --ul:44%; --node-ink:#FFFFFF;
  --f-display:"Zen Kaku Gothic New","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E121A; --surface:#161C28; --ink:#E5E9F0; --muted:#97A0B2; --line:#283043; --line-2:#1C2230;
  --accent:#93ACDF; --accent-ink:#0E121A; --accent-soft:#1F2A40;
  --ok:#6CC28F; --ok-soft:#173023; --bad:#E58670; --bad-soft:#3A1F19;
  --frame:#2A201A; --frame-hi:#4A392C; --rod:#7A7264; --bead:#8E5732; --bead-hi:#CF9160; --beam:#5A4C3E;
  --ul:60%; --node-ink:#0E121A;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E121A; --surface:#161C28; --ink:#E5E9F0; --muted:#97A0B2; --line:#283043; --line-2:#1C2230;
  --accent:#93ACDF; --accent-ink:#0E121A; --accent-soft:#1F2A40;
  --ok:#6CC28F; --ok-soft:#173023; --bad:#E58670; --bad-soft:#3A1F19;
  --frame:#2A201A; --frame-hi:#4A392C; --rod:#7A7264; --bead:#8E5732; --bead-hi:#CF9160; --beam:#5A4C3E;
  --ul:60%; --node-ink:#0E121A;
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}

/* cabeçalho */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.kanji{font-family:var(--f-display);font-size:14px;line-height:1;background:var(--frame);color:var(--beam);padding:7px 5px;border-radius:7px;writing-mode:vertical-rl;letter-spacing:.12em;flex:none}
h1{font-family:var(--f-display);font-size:18px;line-height:1.1;margin:0;white-space:nowrap}
.top p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
@media (max-width:480px){.top p{display:none}}
.top-r{display:flex;align-items:center;gap:6px;flex:none}
.icon-btn{appearance:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.icon-btn[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft);border-color:var(--accent)}
.streak{display:inline-flex;align-items:center;gap:3px;font:600 14px var(--f-num);color:var(--muted);padding:0 4px}
.streak svg{width:18px;height:18px;fill:currentColor;stroke:none}
.streak.on{color:#E07B24}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.go{background:var(--accent-soft);color:var(--accent)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}

main{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:4px 24px;min-height:0}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:4px;gap:2px}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:500 11.5px/1.2 var(--f-body);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:10px;cursor:pointer;min-width:0}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* blocos */
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.h2{font-family:var(--f-display);font-size:17px;line-height:1.25;margin:0;text-wrap:balance}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.btn{appearance:none;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font:600 15px/1 var(--f-body);padding:13px 18px;border-radius:12px;cursor:pointer;min-height:48px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line);box-shadow:none}
.btn.danger{background:var(--bad);color:var(--surface)}
.btn.okb{background:var(--ok);color:var(--surface)}
.btn.badb{background:var(--bad);color:var(--surface)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.link{appearance:none;border:0;background:none;color:var(--accent);font:600 14px var(--f-body);padding:6px 0;cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 0}
.friends{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.friends span{font:500 14px var(--f-num);background:var(--bg);border-radius:8px;padding:7px 10px}
.rules{margin:0;padding-left:18px;display:grid;gap:6px}
.example{border-left:3px solid var(--mark);padding:4px 0 4px 12px}

/* trilha (caminho) */
.goal{display:grid;gap:8px}
.goal-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.prog.big{height:12px}
.prog.big i{background:var(--mark)}
.unit{--uc:hsl(var(--h) 62% var(--ul));--ud:hsl(var(--h) 60% calc(var(--ul) - 14%))}
.unit-b{background:var(--uc);color:var(--node-ink);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 4px 0 var(--ud)}
.unit-b .eyebrow{color:inherit;opacity:.8}
.unit-b .h2{color:inherit}
.unit-b p.d{font-size:13px;opacity:.9}
.unit.locked .unit-b{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line-2)}
.unit-b .link{color:inherit;border:1.5px solid currentColor;border-radius:10px;padding:6px 10px;font-size:13px;white-space:nowrap}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:46px 10px}
.nd{display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
.node{appearance:none;width:68px;height:62px;border-radius:50%;border:0;cursor:pointer;background:var(--uc);color:var(--node-ink);box-shadow:0 6px 0 var(--ud);display:grid;place-items:center;font:600 24px var(--f-num);position:relative}
.node svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ud)}
.node.lk{background:var(--line);color:var(--muted);box-shadow:0 6px 0 var(--line-2)}
.node.cur{outline:4px solid var(--uc);outline-offset:6px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{outline-offset:10px}}
.stars{font-size:15px;letter-spacing:1px;line-height:1;color:var(--line-2)}
.stars b{color:var(--mark);font-weight:400}
.bubble{position:absolute;top:-34px;background:var(--surface);border:2px solid var(--uc);color:var(--ink);font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:10px;white-space:nowrap;z-index:1}
.pop-back{position:fixed;inset:0;background:rgba(10,12,18,.42);z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.pop{width:100%;max-width:520px;background:var(--surface);border-radius:16px;padding:18px;display:grid;gap:12px;border-top:6px solid var(--uc)}
.bigstars{font-size:44px;letter-spacing:6px;line-height:1;text-align:center;color:var(--line)}
.bigstars b{color:var(--mark);font-weight:400}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.tile .v{font:600 22px/1.2 var(--f-num)}
.tile .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* soroban */
.sb{background:linear-gradient(180deg,var(--frame-hi),var(--frame));border-radius:12px;padding:10px 8px;user-select:none;-webkit-user-select:none}
.sb-rods{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);height:var(--H,240px);isolation:isolate}
.beam{position:absolute;left:-8px;right:-8px;top:var(--hh);height:var(--beamh);background:var(--beam);z-index:1}
.rod{position:relative;height:var(--H,240px);cursor:pointer;touch-action:manipulation;outline-offset:-2px;border-radius:6px}
.rod::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--rod);z-index:0}
.bead{position:absolute;left:50%;top:0;width:var(--bw);height:var(--bh);margin-left:calc(var(--bw) / -2);
  clip-path:polygon(0 50%,20% 0,80% 0,100% 50%,80% 100%,20% 100%);
  background:linear-gradient(180deg,var(--bead-hi) 0%,var(--bead) 52%,var(--bead) 100%);z-index:2;
  transition:transform .13s cubic-bezier(.2,.8,.3,1),opacity .13s}
.dot{position:absolute;left:50%;top:calc(var(--hh) + var(--beamh) / 2);width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--frame);z-index:3}
.rod.hl::after{content:"";position:absolute;inset:-4px 3px;border:2px solid var(--mark);border-radius:8px;z-index:4;pointer-events:none}
.sb.locked .rod{cursor:default}
.sb.syn .bead{background:linear-gradient(180deg,hsl(var(--h) 80% 72%) 0%,hsl(var(--h) 65% 50%) 52%,hsl(var(--h) 62% 42%) 100%)}
.sb.syn .bead.off{opacity:.34}
.sb.syn .rod::before{background:hsl(var(--h) 35% 62%)}
.readout{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.readout .v{font:600 34px/1 var(--f-num);font-variant-numeric:tabular-nums}

/* exercícios */
.ex-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ex-head .prog{flex:1}
.x-btn{appearance:none;border:0;background:none;color:var(--muted);font:600 22px/1 var(--f-body);padding:4px 6px;cursor:pointer}
.combo{font:600 12.5px var(--f-body);color:#E07B24;white-space:nowrap}
.prompt{font:600 36px/1.15 var(--f-num);text-align:center;font-variant-numeric:tabular-nums}
.prompt.txt{font-family:var(--f-display);font-size:24px}
.vsum{display:grid;grid-template-columns:auto auto;justify-content:center;column-gap:14px;font:600 30px/1.18 var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
.vsum.long{font-size:22px}
.vsum .op{color:var(--accent)}
.vsum .rule{grid-column:1/-1;border-top:2px solid var(--ink);margin-top:4px}
.fb{border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.fb.hint{background:var(--accent-soft)}
.fb .t{font-weight:600}
.sheet{position:sticky;bottom:0;border-radius:16px;padding:14px 16px;display:grid;gap:10px;z-index:5;box-shadow:0 -4px 18px rgba(0,0,0,.14)}
.sheet.ok{background:var(--ok-soft)}
.sheet.bad{background:var(--bad-soft)}
.sheet .t{font:700 19px/1.2 var(--f-display)}
.sheet.ok .t{color:var(--ok)}
.sheet.bad .t{color:var(--bad)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.steps li{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.step-g{display:grid;gap:4px}
.step-t{font:600 14px var(--f-num)}
.tech{font-size:11.5px;font-weight:600;color:var(--accent)}
.ex-l,.ex-r{display:contents}
.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}.o7{order:7}.o8{order:8}

/* teclado numérico */
.kp-disp{font:600 40px/1.1 var(--f-num);text-align:center;padding:8px;border-bottom:2px solid var(--line);min-height:60px;font-variant-numeric:tabular-nums}
.kp-disp.empty{color:var(--line)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{appearance:none;min-height:54px;font:600 22px var(--f-num);background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--line)}
.key:active{background:var(--accent-soft)}
.key.go{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-family:var(--f-body);font-size:17px}
.key:disabled{opacity:.45}

/* flash e ajustes */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:16px;height:min(50vh,330px);display:grid;place-items:center;overflow:hidden}
.stage-num{font:600 clamp(72px,26vw,160px)/1 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stage-num.cd{color:var(--muted);font-size:clamp(44px,14vw,88px)}
.stage-num.neg{color:var(--bad)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{appearance:none;border:0;background:none;padding:9px 6px;border-radius:7px;font:600 14px var(--f-body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.16)}
.ops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ops button{appearance:none;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 14px var(--f-body);cursor:pointer;text-align:left}
.ops button b{font:600 20px/1 var(--f-num);width:20px;text-align:center}
.ops button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:11px;border-top:1px solid var(--line)}
.field:first-child{border-top:0;padding-top:0}
.field label{font-weight:500}
.field-v{display:grid;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.field-v:first-child{border-top:0;padding-top:0}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{appearance:none;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 20px var(--f-num);cursor:pointer}
.stepper output{min-width:56px;text-align:center;font:600 17px var(--f-num)}
.switch{appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(18px)}
.lvl{display:flex;align-items:baseline;gap:10px}
.lvl .v{font:600 44px/1 var(--f-num)}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.seq{display:flex;flex-wrap:wrap;gap:6px}
.seq span{font:500 14px var(--f-num);background:var(--bg);border-radius:6px;padding:4px 8px}
.seq span.neg{color:var(--bad)}
.hues{display:flex;gap:4px}
.hues i{width:14px;height:14px;border-radius:4px;background:hsl(var(--h) 65% 52%)}

/* painel */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .v{font:600 26px/1.15 var(--f-num);font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .t{fill:var(--muted);font:10.5px var(--f-num)}
.chart .b-ok{fill:var(--accent)}
.chart .b-bad{fill:var(--bad);opacity:.6}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:6px 6px 6px 0}
.tbl td{padding:9px 6px 9px 0;border-top:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right;padding-left:10px;white-space:nowrap}

/* giro manual (modo de compatibilidade): o app inteiro gira 90° dentro da tela em pé */
html.rot,html.rot body{overflow:hidden}
html.rot .app{position:fixed;top:0;left:100vw;width:100vh;height:100vw;max-width:none;margin:0;transform-origin:0 0;transform:rotate(90deg);
  padding-left:16px;padding-right:16px}

/* celular deitado: abas viram trilho lateral, cabeçalho encolhe, conta à esquerda e soroban à direita */
html.land .app{max-width:980px;display:grid;grid-template-columns:68px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);column-gap:12px}
html.land .top{grid-column:2;grid-row:1;padding-block:6px 4px}
html.land .top p{display:none}
html.land h1{font-size:16px}
html.land .kanji{font-size:11px;padding:5px 4px}
html.land .icon-btn{width:34px;height:34px}
html.land main{grid-column:2;grid-row:2;padding-block:2px 12px}
html.land .tabs{grid-column:1;grid-row:1 / 3;grid-template-columns:1fr;grid-auto-rows:min-content;align-content:center;margin:8px 0;gap:4px}
html.land .tab{padding:7px 0}
html.land .ex{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px 18px;align-items:start}
html.land .ex>.ex-head,html.land .ex>.sheet{grid-column:1 / -1}
html.land .ex-l,html.land .ex-r{display:flex;flex-direction:column;gap:10px;min-width:0}
html.land .prompt{font-size:28px}
html.land .prompt.txt{font-size:20px}

<script>
(()=>{
"use strict";
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false) continue;
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k==='style') e.style.cssText=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  for(const k of kids.flat(9)){ if(k==null||k===false) continue; e.append(k.nodeType?k:document.createTextNode(String(k))); }
  return e;
}
const svgI=d=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.innerHTML=d;return s;};
const ICON={book:'<path d="M4 19.5V5a2 2 0 0 1 2-2h14v15H6a2 2 0 0 0-2 2zm0 0A2 2 0 0 0 6 22h14"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>'};
const MINUS='−', TIMES='×', DIV='÷';
const fmt=n=>Number(n).toLocaleString('pt-BR');
const fmt1=n=>Number(n).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const secs=ms=>fmt1(ms/1000)+' s';
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const num=d=>d<=1?rnd(1,9):rnd(10**(d-1),10**d-1);
const today=(d=new Date())=>{const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());};
const PLACE=['unidades','dezenas','centenas','milhares','dezenas de milhar','centenas de milhar','milhões','dezenas de milhões','centenas de milhões','bilhões','dezenas de bilhões','centenas de bilhões','trilhões'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const starsTxt=(n,cls='stars')=>h('span',{class:cls,'aria-label':`${n} de 3 estrelas`},[0,1,2].map(k=>k<n?h('b',{},'★'):'★'));

/* ---------- armazenamento (só neste aparelho) ---------- */
const KEY='soroban-de-bolso.v1';
const DEF=()=>({hist:[],lessons:{},trilha:{},stars:{},seen:{},xp:{total:0,days:{}},goal:20,orient:'auto',rods:7,syn:false,
  flash:{level:1,max:1,streak:0,miss:0,mode:'adapt',sound:true,free:{digits:1,count:5,interval:1.0,sub:false}},
  contas:{free:{ops:{add:true,sub:true,mul:false,div:false},digits:2,terms:3,digitsB:1}}});
function load(){
  try{
    const r=JSON.parse(localStorage.getItem(KEY)||'null');
    if(r&&Array.isArray(r.hist)){
      const d=DEF(), rf=r.flash||{}, rc=r.contas||{}, rcf=rc.free||{};
      const S0={...d,...r,lessons:r.lessons||{},trilha:r.trilha||{},stars:r.stars||{},seen:r.seen||{},xp:{...d.xp,...(r.xp||{})},
        flash:{...d.flash,...rf,free:{...d.flash.free,...(rf.free||{})}},
        contas:{free:{...d.contas.free,...rcf,ops:{...d.contas.free.ops,...(rcf.ops||{})}}}};
      if(!r.stars){ // migração: notas antigas (de 10) viram estrelas
        for(const src of [S0.lessons,S0.trilha]) for(const [id,v] of Object.entries(src)){const b=v.best||0;S0.stars[id]=b>=10?3:b>=9?2:b>=7?1:0;}
      }
      return S0;
    }
  }catch(e){}
  return DEF();
}
let S=load();
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
function record(m,k,ok,ms,t){ S.hist.push({d:today(),m,k,t,ok:!!ok,ms:Math.round(ms)}); if(S.hist.length>4000) S.hist=S.hist.slice(-4000); save(); updateStreak(); }
function addXP(n){ if(!n) return; S.xp.total+=n; const d=today(); S.xp.days[d]=(S.xp.days[d]||0)+n; save(); }
const xpToday=()=>S.xp.days[today()]||0;

/* ---------- orientação da tela ---------- */
const OR={locked:false};
const isRot=()=>document.documentElement.classList.contains('rot');
const viewH=()=>isRot()?window.innerWidth:window.innerHeight;
function syncLayoutClass(){
  const html=document.documentElement;
  if(S.orient!=='auto'&&!OR.locked){
    const deviceLand=window.innerWidth>window.innerHeight;
    html.classList.toggle('rot',S.orient==='land'?!deviceLand:deviceLand);
  } else html.classList.remove('rot');
  const w=isRot()?window.innerHeight:window.innerWidth, hgt=viewH();
  html.classList.toggle('land',w>hgt&&hgt<=540);
}
async function applyOrientation(fromClick){
  OR.locked=false;
  const so=screen.orientation;
  if(S.orient==='auto'){ try{so&&so.unlock&&so.unlock();}catch(_){} syncLayoutClass(); return; }
  const target=S.orient==='land'?'landscape':'portrait';
  try{ await so.lock(target); OR.locked=true; }
  catch(e){
    if(fromClick&&document.documentElement.requestFullscreen&&!document.fullscreenElement){
      try{ await document.documentElement.requestFullscreen({navigationUI:'hide'}); await so.lock(target); OR.locked=true; }catch(_){}
    }
  }
  syncLayoutClass();
}
window.addEventListener('resize',syncLayoutClass);
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement&&S.orient!=='auto') applyOrientation(false); });

/* ---------- som ---------- */
let actx=null;
function ensureAudio(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(_){actx=null;} }
/* Sinestesia: cada haste tem uma nota-base (as da esquerda, de valor maior, mais graves);
   o valor da haste sobe a nota pela escala maior: 0 = nota-base, 9 = uma oitava e uma terça acima. */
const HUES=[205,345,45,150,275,20,180,320,85,240];
const BASES=[72,67,64,60,57,55,52,48,45,43,40,38,36];
const STEP=[0,2,4,5,7,9,11,12,14,16];
function tone(m,dur=0.6,vol=0.16){
  ensureAudio(); if(!actx) return;
  try{
    const f=440*Math.pow(2,(m-69)/12), t=actx.currentTime;
    const g=actx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    const o1=actx.createOscillator(); o1.type='triangle'; o1.frequency.value=f;
    const o2=actx.createOscillator(); o2.type='sine'; o2.frequency.value=f*2;
    const g2=actx.createGain(); g2.gain.value=0.22;
    o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(actx.destination);
    o1.start(t); o2.start(t); o1.stop(t+dur+0.05); o2.stop(t+dur+0.05);
  }catch(_){}
}
const playNote=(place,d)=>tone((BASES[place]??36)+STEP[d]);
const chime=ok=>{ if(!S.flash.sound) return; if(ok){tone(76,0.25,0.1);setTimeout(()=>tone(83,0.35,0.1),90);} else tone(55,0.35,0.08); };

/* ---------- o soroban ---------- */
function makeBoard(n,{interactive=true,onChange}={}){
  const digits=Array(n).fill(0); // índice 0 = haste mais à esquerda
  let locked=!interactive;
  const root=h('div',{class:'sb'+(locked?' locked':'')+(S.syn?' syn':'')});
  const rodsEl=h('div',{class:'sb-rods',style:'--n:'+n});
  rodsEl.append(h('div',{class:'beam'}));
  const rods=[];
  for(let i=0;i<n;i++){
    const place=n-1-i;
    const rod=h('div',{class:'rod',tabindex:interactive?'0':null,role:interactive?'button':'img',style:'--h:'+HUES[place%HUES.length]});
    const heaven=h('div',{class:'bead'});
    const earth=[0,1,2,3].map(()=>h('div',{class:'bead'}));
    rod.append(heaven,...earth);
    if(place%3===0) rod.append(h('div',{class:'dot'}));
    rods.push({rod,heaven,earth});
    rodsEl.append(rod);
    if(interactive){
      rod.addEventListener('pointerdown',e=>tap(i,e));
      rod.addEventListener('keydown',e=>{
        if(locked) return;
        if(e.key==='ArrowUp'){digits[i]=(digits[i]+1)%10;changed(i);e.preventDefault();}
        if(e.key==='ArrowDown'){digits[i]=(digits[i]+9)%10;changed(i);e.preventDefault();}
      });
    }
  }
  root.append(rodsEl);
  let G={bw:40,bh:20,hh:48,beamh:6,eh:108};
  function layout(){
    const w=rodsEl.clientWidth; if(!w) return;
    // a largura manda, mas a altura também limita (celular deitado): no máximo ~55% da tela
    const col=w/n, maxBh=Math.max(12,Math.floor((viewH()*0.55-22)/7));
    const bh=Math.min(Math.round(Math.min(col*0.9,68)*0.5),maxBh), bw=Math.min(col*0.9,68,bh*2.3);
    G={bw,bh,hh:bh*2+8,beamh:6,eh:bh*5+8};
    const H=G.hh+G.beamh+G.eh;
    for(const [k,v] of Object.entries({'--bw':bw,'--bh':bh,'--hh':G.hh,'--beamh':G.beamh,'--H':H})) rodsEl.style.setProperty(k,v+'px');
    paint();
  }
  const earthY=(j,c)=>G.hh+G.beamh+(j<c?1+j*G.bh:G.eh-(4-j)*G.bh-1);
  function paint(){
    rods.forEach((r,i)=>{
      const d=digits[i], up=d>=5, c=d%5;
      r.heaven.style.transform=`translateY(${up?G.hh-G.bh-1:2}px)`;
      r.heaven.classList.toggle('off',!up);
      r.earth.forEach((b,j)=>{b.style.transform=`translateY(${earthY(j,c)}px)`;b.classList.toggle('off',j>=c);});
      r.rod.setAttribute('aria-label',`${cap(PLACE[n-1-i]||'haste')}: ${d}`);
    });
  }
  function changed(i){ paint(); if(S.syn) playNote(n-1-i,digits[i]); onChange&&onChange(value()); }
  function tap(i,e){
    if(locked) return;
    e.preventDefault();
    const r=rods[i].rod.getBoundingClientRect();
    const y=isRot()?(r.right-e.clientX):(e.clientY-r.top); // no giro manual, o "para baixo" da haste aponta para a esquerda da tela
    let d=digits[i]; const up=d>=5; let c=d%5;
    if(y<G.hh+G.beamh/2){ d=up?d-5:d+5; }
    else{
      let best=0,bd=1e9;
      for(let j=0;j<4;j++){const cy=earthY(j,c)+G.bh/2;const dd=Math.abs(cy-y);if(dd<bd){bd=dd;best=j;}}
      c=best<c?best:best+1; d=(up?5:0)+c;
    }
    digits[i]=d;
    try{navigator.vibrate&&navigator.vibrate(6);}catch(_){}
    changed(i);
  }
  function value(){ return digits.reduce((a,d)=>a*10+d,0); }
  function set(v){ v=Math.max(0,Math.floor(v)); for(let i=n-1;i>=0;i--){digits[i]=v%10;v=Math.floor(v/10);} paint(); }
  function highlight(places){ rods.forEach((r,i)=>r.rod.classList.toggle('hl',places.includes(n-1-i))); }
  function lock(b){ locked=b; root.classList.toggle('locked',b); }
  try{ new ResizeObserver(layout).observe(rodsEl); }catch(_){}
  window.addEventListener('resize',()=>{ if(document.body.contains(root)) layout(); });
  requestAnimationFrame(layout);
  return {el:root,value,set,highlight,lock,clear:()=>{set(0);onChange&&onChange(0);}};
}
const digitDesc=d=>d===0?'vazia':d<5?`${d} de baixo`:d===5?'a de cima':`a de cima + ${d-5} de baixo`;

/* ---------- técnicas: simula conta a conta, da esquerda para a direita ---------- */
const TECH={direto:'direto',amigo5:'amigo do 5',amigo10:'amigo do 10',misto:'misto (5 e 10)'};
function addAt(D,p,d,steps,carry){
  const c=D[p];
  if(c+d<=9){
    if(d<5){
      if(c%5+d<=4) steps.push({p,t:'direto',txt:`+${d}`,carry});
      else steps.push({p,t:'amigo5',txt:`+5 ${MINUS}${5-d}`,carry});
    } else steps.push({p,t:'direto',txt:d===5?'+5':`+5 +${d-5}`,carry});
    D[p]=c+d;
  } else {
    const k=10-d;
    const direct=k<5?(c%5>=k):(c>=5);
    steps.push(direct?{p,t:'amigo10',txt:`${MINUS}${k} aqui, +1 à esquerda`,carry}
                     :{p,t:'misto',txt:`${MINUS}${k} aqui (= ${MINUS}5 +${5-k}), +1 à esquerda`,carry});
    D[p]=c-k;
    addAt(D,p+1,1,steps,'vai um');
  }
}
function subAt(D,p,d,steps,carry){
  const c=D[p];
  if(c>=d){
    if(d<5){
      if(c%5>=d) steps.push({p,t:'direto',txt:`${MINUS}${d}`,carry});
      else steps.push({p,t:'amigo5',txt:`${MINUS}5 +${5-d}`,carry});
    } else steps.push({p,t:'direto',txt:d===5?`${MINUS}5`:`${MINUS}5 ${MINUS}${d-5}`,carry});
    D[p]=c-d;
  } else {
    const k=10-d;
    const direct=k<5?(c%5+k<=4):true;
    steps.push(direct?{p,t:'amigo10',txt:`+${k} aqui, ${MINUS}1 à esquerda`,carry}
                     :{p,t:'misto',txt:`+${k} aqui (= +5 ${MINUS}${5-k}), ${MINUS}1 à esquerda`,carry});
    D[p]=c+k;
    subAt(D,p+1,1,steps,'empresta um');
  }
}
function analyze(start,terms){
  const D=Array(14).fill(0); let v=start;
  for(let p=0;v>0;p++){D[p]=v%10;v=Math.floor(v/10);}
  const groups=[], techs=new Set(); let run=start;
  for(const [op,n] of terms){
    run=op==='+'?run+n:run-n;
    if(run<0) return {result:-1,groups,techs};
    const steps=[], s=String(n);
    for(let i=0;i<s.length;i++){const d=+s[i]; if(!d) continue; (op==='+'?addAt:subAt)(D,s.length-1-i,d,steps,false);}
    steps.forEach(st=>techs.add(st.t));
    groups.push({label:`${op==='+'?'+':MINUS} ${fmt(n)}`,steps});
  }
  return {result:run,groups,techs};
}
function stepsEl(groups){
  return h('div',{class:'stack',style:'gap:10px'},groups.map(g=>h('div',{class:'step-g'},
    h('div',{class:'step-t'},g.label),
    h('ul',{class:'steps'},g.steps.map(st=>h('li',{},
      h('span',{},`${cap(PLACE[st.p])}: `),
      h('span',{class:'num'},st.txt),
      st.carry?h('span',{class:'muted small'},`(${st.carry})`):null,
      st.t!=='direto'?h('span',{class:'tech'},TECH[st.t]):null
    )))
  )));
}
function mulSteps(a,b){
  const parts=x=>[...String(x)].map((c,i,s)=>(+c)*10**(s.length-1-i)).filter(Boolean);
  const lines=[];
  for(const x of parts(a)) for(const y of parts(b)) lines.push(`${fmt(x)} ${TIMES} ${fmt(y)} = ${fmt(x*y)}`);
  return h('div',{class:'stack',style:'gap:6px'},
    h('p',{class:'small'},'Separe os números por casa e multiplique cada par:'),
    h('ul',{class:'steps num'},lines.map(l=>h('li',{},l))),
    h('p',{class:'small'},'Some esses produtos no soroban, um depois do outro, e leia o total.'));
}
function divSteps(a,b){
  const s=String(a), lines=[]; let cur=0, started=false;
  for(const c of s){
    cur=cur*10+(+c);
    if(cur>=b||started){
      const q=Math.floor(cur/b); started=true;
      lines.push(`${fmt(cur)} ${DIV} ${fmt(b)} = ${q}  (${q} ${TIMES} ${fmt(b)} = ${fmt(q*b)}, sobra ${fmt(cur-q*b)})`);
      cur-=q*b;
    }
  }
  return h('div',{class:'stack',style:'gap:6px'},
    h('p',{class:'small'},'Pela chave, da esquerda para a direita. Cada linha dá um algarismo do resultado:'),
    h('ul',{class:'steps num'},lines.map(l=>h('li',{},l))),
    h('p',{class:'small'},'Junte os algarismos na ordem para formar o resultado.'));
}

/* ---------- geradores ---------- */
function search(make,ok){
  for(let t=0;t<1500;t++){
    const {start,terms}=make(); const r=analyze(start,terms);
    if(r.result>=0&&ok(r.techs,r)) return {kind:'op',start,terms,target:r.result};
  }
  return {kind:'op',start:2,terms:[['+',3]],target:5};
}
function chainGen(terms,digits,{add=true,sub=false}={}){
  for(let tries=0;tries<80;tries++){
    const list=[]; let run=0, bad=false;
    if(!add){
      const first=num(Math.min(digits+1,5)); list.push(['+',first]); run=first;
      for(let k=1;k<terms;k++){ const n=num(digits); if(n>run){bad=true;break;} list.push(['-',n]); run-=n; }
    } else {
      for(let k=0;k<terms;k++){
        const n=num(digits);
        if(sub&&k>0&&run-n>=0&&Math.random()<0.45){list.push(['-',n]);run-=n;} else {list.push(['+',n]);run+=n;}
      }
      if(sub&&terms>=3&&!list.some(x=>x[0]==='-')) bad=true;
    }
    if(bad||run<0) continue;
    return {kind:'op',start:0,terms:list,target:run};
  }
  const a=num(digits),b=num(digits); return {kind:'op',start:0,terms:[['+',a],['+',b]],target:a+b};
}
function mulGen(da,db){ const a=Math.max(2,num(da)), b=db<=1?rnd(2,9):num(db); return {kind:'mul',a,b,target:a*b}; }
function divGen(dq,db){ const b=db<=1?rnd(2,9):num(db), q=dq<=1?rnd(2,9):num(dq); return {kind:'div',a:b*q,b,target:q}; }

/* ---------- conteúdo: lições de técnica e etapas de prática ---------- */
const only5=T=>T.has('amigo5')&&!T.has('amigo10')&&!T.has('misto');

const ORDER=UNITS.flatMap(u=>u.nodes);
const unitOf=id=>UNITS.findIndex(u=>u.nodes.includes(id));
const ROUND=8;
const starsFor=ok=>ok>=8?3:ok>=7?2:ok>=6?1:0;
const starsOf=id=>S.stars[id]||0;
const unlocked=id=>{const i=ORDER.indexOf(id);return i===0||starsOf(id)>0||starsOf(ORDER[i-1])>0;};
const currentId=()=>ORDER.find(id=>unlocked(id)&&!starsOf(id))||null;

/* ---------- treino livre ---------- */
function genFree(){
  const f=S.contas.free, types=[];
  if(f.ops.add||f.ops.sub) types.push('chain'); if(f.ops.mul) types.push('mul'); if(f.ops.div) types.push('div');
  if(!types.length) types.push('chain');
  const t=types[rnd(0,types.length-1)];
  if(t==='mul') return mulGen(f.digits,f.digitsB);
  if(t==='div') return divGen(f.digits,f.digitsB);
  return chainGen(f.terms,f.digits,{add:f.ops.add||!f.ops.sub,sub:f.ops.sub});
}
const FREE_UNIT={id:'livre',title:'Treino livre',rods:7};

/* ---------- sessões: o mesmo motor serve a trilha e o treino livre ---------- */
const SESS={trilha:null,treino:null};
const kindTag=it=>it.kind==='op'?'cadeia':it.kind;
function makeItems(gen,count){
  const items=[], seen=new Set();
  for(let i=0;i<count;i++){let it,t=0;do{it=gen(i);t++;}while(seen.has(JSON.stringify(it))&&t<20);seen.add(JSON.stringify(it));items.push({it});}
  return items;
}
function startNode(id){
  const u=NODES[id];
  if(u.type==='lesson'&&!S.seen[id]){ S.seen[id]=1; save(); SESS.trilha={mode:'intro',unit:u}; render(); return; }
  SESS.trilha={mode:'ex',route:'trilha',unit:u,queue:makeItems(i=>u.gen(i),ROUND),i:0,res:[],combo:0,xp:0};
  render();
}
function startJump(k){
  const prev=UNITS[k-1].nodes.map(id=>NODES[id]);
  const u={id:'pulo'+(k+1),title:`Teste para pular para a unidade ${k+1}`,rods:7};
  SESS.trilha={mode:'ex',route:'trilha',unit:u,queue:makeItems(i=>prev[i%prev.length].gen(5),ROUND),i:0,res:[],combo:0,xp:0,jump:k};
  render();
}
function startFree(){ SESS.treino={mode:'ex',route:'treino',unit:FREE_UNIT,queue:[{it:genFree()}],i:0,res:[],combo:0,xp:0,endless:true}; render(); }

function promptOf(it){
  if(it.kind==='set') return h('div',{class:'prompt'},`Marque ${fmt(it.target)}`);
  if(it.kind==='read') return h('div',{class:'prompt txt'},'Que número está no soroban?');
  if(it.kind==='mul') return h('div',{class:'prompt'},`${fmt(it.a)} ${TIMES} ${fmt(it.b)}`);
  if(it.kind==='div') return h('div',{class:'prompt'},`${fmt(it.a)} ${DIV} ${fmt(it.b)}`);
  if(it.start===0&&it.terms.length>=2)
    return h('div',{class:'vsum'+(it.terms.length>5?' long':'')},
      it.terms.map(([op,n],k)=>[h('span',{class:'op'},k===0?'':(op==='+'?'+':MINUS)),h('span',{},fmt(n))]),
      h('span',{class:'rule'}));
  return h('div',{class:'prompt'},`${fmt(it.start)} ${it.terms[0][0]==='+'?'+':MINUS} ${fmt(it.terms[0][1])}`);
}
function hintBody(it,board){
  if(it.kind==='op'){const a=analyze(it.start,it.terms);board.highlight([...new Set(a.groups.flatMap(g=>g.steps.map(s=>s.p)))]);return stepsEl(a.groups);}
  if(it.kind==='set'){const s=String(it.target);board.highlight([...s].map((_,k)=>s.length-1-k));return h('ul',{class:'steps'},[...s].map((c,k)=>h('li',{},`${cap(PLACE[s.length-1-k])}: ${digitDesc(+c)}`)));}
  if(it.kind==='mul') return mulSteps(it.a,it.b);
  if(it.kind==='div') return divSteps(it.a,it.b);
  return h('p',{},'Em cada haste: 5 pela conta de cima, se estiver encostada na barra, e 1 por conta de baixo encostada. O ponto marca as unidades.');
}
const PRAISE=['Muito bem!','Isso!','Certíssimo!','Mandou bem!','Perfeito!'];
function viewExercise(sess){
  const u=sess.unit, route=sess.route, q=sess.queue[sess.i], it=q.it;
  sess.t0=performance.now(); sess.hint=false; sess.answered=false;
  const usesKp=it.kind==='read'||it.kind==='mul'||it.kind==='div';
  const board=makeBoard(u.rods,{interactive:it.kind!=='read'});
  board.set(it.kind==='read'?it.target:(it.start||0));
  const kp=usesKp?makeKeypad(v=>check(v)):null;
  const hintBox=h('div',{class:'o7'});
  const sheet=h('div',{class:'sheet o8',hidden:true});
  const hintBtn=h('button',{class:'btn ghost',onclick:showHint},'Dica');
  const checkBtn=h('button',{class:'btn',onclick:()=>check()},'Conferir');
  const copyBtn=(it.kind==='mul'||it.kind==='div')?h('button',{class:'btn ghost',onclick:()=>kp.set(board.value())},'Copiar do soroban'):null;
  const actions=h('div',{class:'row o6'},...(usesKp?[hintBtn,copyBtn]:[hintBtn,checkBtn]).filter(Boolean));
  const note=it.kind==='op'?(it.start===0?'Comece do zero e faça as parcelas em ordem no soroban.':`O soroban já mostra ${fmt(it.start)}. Faça a conta nele.`)
            :it.kind==='set'?'Mova as contas até formar o número.'
            :it.kind==='read'?'Leia as hastes e digite o número.'
            :'Use o soroban para as contas parciais e digite o resultado (ou copie do soroban).';
  function showHint(){ sess.hint=true; hintBox.replaceChildren(h('div',{class:'fb hint'},h('p',{class:'t'},'Como fazer'),hintBody(it,board))); }
  function check(typed){
    if(sess.answered) return; sess.answered=true;
    const v=usesKp?typed:board.value(), ms=performance.now()-sess.t0, ok=v===it.target, clean=ok&&!sess.hint;
    if(!q.retry){
      sess.res.push({ok:clean,ms});
      record(route==='treino'?'treino':'trilha',u.id,clean,ms,kindTag(it));
      if(clean){addXP(1);sess.xp++;}
    }
    sess.combo=clean?sess.combo+1:0;
    if(!ok&&!q.retry&&!sess.endless) sess.queue.push({it,retry:true});
    chime(ok);
    board.highlight([]); board.lock(true); if(kp) kp.disable(true); actions.hidden=true;
    const goBtn=h('button',{class:'btn block '+(ok?'okb':'badb'),onclick:next},'Continuar');
    const detail=(it.kind!=='set'&&it.kind!=='read')?h('details',{open:!ok},h('summary',{class:'small'},'Passo a passo'),h('div',{style:'margin-top:8px'},hintBody(it,{highlight(){}}))):null;
    sheet.className='sheet o8 '+(ok?'ok':'bad');
    sheet.replaceChildren(
      h('p',{class:'t'},ok?(sess.hint?'Certo, com dica':PRAISE[rnd(0,PRAISE.length-1)]):'Resposta certa: '+fmt(it.target)),
      h('p',{class:'small'},ok?(`${secs(ms)}`+(sess.combo>=3?` · ${sess.combo} seguidas`:'')+(clean&&!q.retry?' · +1 XP':''))
        :(`Você marcou ${fmt(v)}.`+(!sess.endless&&!q.retry?' Esta conta volta no fim da lição.':''))),
      ...(detail?[detail]:[]), goBtn);
    sheet.hidden=false;
    if(sess.endless) scoreEl.textContent=scoreText();
    requestAnimationFrame(()=>{sheet.scrollIntoView({block:'nearest'});goBtn.focus({preventScroll:true});});
  }
  function next(){
    sess.i++;
    if(sess.endless){ sess.queue.push({it:genFree()}); render(); return; }
    if(sess.i>=sess.queue.length) finish(sess); else render();
  }
  const scoreText=()=>`${sess.res.filter(r=>r.ok).length} de ${sess.res.length} certas`;
  const scoreEl=h('span',{class:'num muted small'},scoreText());
  const head=sess.endless
    ?h('div',{class:'ex-head'},h('button',{class:'x-btn','aria-label':'Sair',onclick:()=>{SESS[route]=null;render();}},'✕'),scoreEl,
        h('button',{class:'link',onclick:()=>{if(sess.res.length) finish(sess); else {SESS[route]=null;render();}}},'Encerrar'))
    :h('div',{class:'ex-head'},h('button',{class:'x-btn','aria-label':'Sair da lição',onclick:()=>{SESS[route]=null;render();}},'✕'),
        h('div',{class:'prog'},h('i',{style:`width:${sess.i/sess.queue.length*100}%`})),
        sess.combo>=3?h('span',{class:'combo'},`${sess.combo} seguidas`):null);
  const prompt=promptOf(it); prompt.classList.add('o2');
  board.el.classList.add('o4'); if(kp) kp.el.classList.add('o5');
  return h('div',{class:'stack ex'},
    head,
    h('div',{class:'ex-l'},
      h('p',{class:'eyebrow o1',style:'text-align:center'},q.retry?'Revisão · '+u.title:u.title),
      prompt,
      h('p',{class:'muted small o3',style:'text-align:center'},note),
      kp?kp.el:null,
      hintBox),
    h('div',{class:'ex-r'},board.el,actions),
    sheet);
}
function finish(sess){
  const route=sess.route, u=sess.unit, n=sess.res.length, okN=sess.res.filter(r=>r.ok).length, avg=n?sess.res.reduce((a,r)=>a+r.ms,0)/n:0;
  const before=xpToday();
  if(sess.endless){ SESS[route]={mode:'sum',endless:true,unit:u,okN,n,avg,xp:sess.xp}; render(); return; }
  let stars=0,bonus=0,jumped=false,prevStars=0;
  if(sess.jump!=null){
    if(okN>=7){ jumped=true; for(const id of ORDER.slice(0,ORDER.indexOf(UNITS[sess.jump].nodes[0]))) if(!S.stars[id]) S.stars[id]=1; bonus=10; }
  } else {
    stars=starsFor(okN); prevStars=starsOf(u.id);
    if(stars>0) bonus+=5; if(stars===3) bonus+=5;
    if(stars>prevStars) S.stars[u.id]=stars;
  }
  addXP(bonus); save();
  SESS.trilha={mode:'sum',unit:u,okN,n,avg,stars,xp:sess.xp+bonus,jump:sess.jump,jumped,prevStars,goalHit:before<S.goal&&xpToday()>=S.goal};
  render();
}
function viewSummary(s){
  if(s.endless){
    return h('div',{class:'stack'},
      h('p',{class:'h2',style:'text-align:center;font-size:24px'},'Treino encerrado'),
      h('div',{class:'tiles'},tile(`+${s.xp}`,'XP'),tile(`${s.okN}/${s.n}`,'Acerto'),tile(secs(s.avg),'Por conta')),
      h('p',{class:'muted',style:'text-align:center'},s.n&&s.okN/s.n>=0.9?'Acerto alto. Se ficou fácil, aumente os dígitos ou as parcelas.':'Contas com dica contam como erro. Repita até passar de 90%.'),
      h('div',{class:'row'},h('button',{class:'btn ghost',onclick:()=>{SESS.treino=null;render();}},'Ajustes'),h('button',{class:'btn',onclick:startFree},'De novo')));
  }
  const u=s.unit;
  let title,msg;
  if(s.jump!=null){ title=s.jumped?'Unidade liberada!':'Ainda não'; msg=s.jumped?`As etapas anteriores ficaram marcadas como concluídas. Siga pela unidade ${s.jump+1}.`:'O pulo pede 7 acertos de 8. Faça as etapas anteriores ou tente de novo mais tarde.'; }
  else if(s.stars>0){ title=s.stars===3?'Etapa perfeita!':'Etapa concluída!'; msg=s.stars>s.prevStars&&s.prevStars>0?'Você melhorou suas estrelas nesta etapa.':s.stars<3?'Refaça quando quiser para buscar as 3 estrelas (8 de 8).':'Nenhum erro na primeira tentativa.'; }
  else { title='Quase lá'; msg='A próxima etapa abre com 6 acertos de 8 na primeira tentativa. As contas que você errou voltaram no fim para fixar.'; }
  return h('div',{class:'stack',style:'padding-top:12px'},
    h('p',{class:'h2',style:'text-align:center;font-size:26px'},title),
    s.jump==null?starsTxt(s.stars,'bigstars'):null,
    h('p',{class:'eyebrow',style:'text-align:center'},u.title),
    h('div',{class:'tiles'},tile(`+${s.xp}`,'XP'),tile(`${s.okN}/${ROUND}`,'Acerto'),tile(secs(s.avg),'Por conta')),
    s.goalHit?h('div',{class:'fb hint',style:'text-align:center'},h('p',{class:'t'},'Meta do dia cumprida!'),h('p',{class:'small'},`${xpToday()} XP hoje. A sequência de dias continua.`)):null,
    h('p',{class:'muted',style:'text-align:center'},msg),
    h('div',{class:'row'},
      s.jump!=null?h('button',{class:'btn ghost',onclick:()=>startJump(s.jump)},'Tentar de novo'):h('button',{class:'btn ghost',onclick:()=>startNode(u.id)},'Repetir'),
      h('button',{class:'btn',onclick:()=>{SESS.trilha=null;render();scrollToCurrent();}},'Continuar')));
}
const tile=(v,l)=>h('div',{class:'tile'},h('div',{class:'v'},v),h('div',{class:'l'},l));

/* ---------- aba Trilha (caminho estilo Duolingo) ---------- */
const ZIG=[0,56,84,56,0,-56,-84,-56];
function viewTrilha(){
  const s=SESS.trilha;
  if(s&&s.mode==='intro') return viewIntro(s);
  if(s&&s.mode==='ex') return viewExercise(s);
  if(s&&s.mode==='sum') return viewSummary(s);
  const cur=currentId(), xpT=xpToday(), g=S.goal;
  const total=ORDER.reduce((a,id)=>a+starsOf(id),0);
  const goal=h('div',{class:'card goal'},
    h('div',{class:'goal-top'},h('p',{class:'eyebrow'},'Meta de hoje'),h('span',{class:'num small'},`${Math.min(xpT,g)}/${g} XP`)),
    h('div',{class:'prog big'},h('i',{style:`width:${Math.min(100,xpT/g*100)}%`})),
    h('p',{class:'muted small'},xpT>=g?'Meta cumprida. Cada etapa a mais é lucro.':`Faltam ${g-xpT} XP. Cada acerto vale 1 XP; concluir uma etapa vale +5, e a perfeita, +10.`),
    h('p',{class:'small muted'},`${total} de ${ORDER.length*3} estrelas · ${fmt(S.xp.total)} XP no total`));
  let gi=0;
  const units=UNITS.map((U,k)=>{
    const open=unlocked(U.nodes[0]);
    const path=h('div',{class:'path'},U.nodes.map(id=>{
      const nd=NODES[id], st=starsOf(id), lk=!unlocked(id), isCur=id===cur, x=ZIG[gi++%ZIG.length];
      const inner=lk?svgI(ICON.lock):nd.type==='lesson'?svgI(ICON.book):h('span',{},nd.sym);

function makeKeypad(onDone,{max=8}={}){
  let v='', off=false;
  const disp=h('div',{class:'kp-disp empty','aria-live':'polite'},'0');
  const go=h('button',{class:'key go',disabled:true,onclick:()=>done()},'OK');
  const keys=[1,2,3,4,5,6,7,8,9].map(n=>h('button',{class:'key',onclick:()=>press(String(n))},n));

  function paint(){disp.textContent=v?fmt(+v):'0';disp.classList.toggle('empty',!v);go.disabled=!v||off;}
  function press(k){ if(off) return; if(k==='back') v=v.slice(0,-1); else if(v.length<max) v=(v==='0'?'':v)+k; paint(); }
  function done(){ if(!v||off) return; onDone(+v); }

    set(x){ if(off) return; v=x?String(x).slice(0,max):''; paint(); },

function genSeq(count,digits,sub){
  const lo=digits===1?1:10**(digits-1), hi=10**digits-1, seq=[]; let tot=0,prev=0;

    if(sub&&i>0&&tot-n>=0&&Math.random()<0.4){seq.push(-n);tot-=n;} else {seq.push(n);tot+=n;}
  }

}

}

function dayStreak(){
  const days=new Set(S.hist.map(x=>x.d)); let n=0; const d=new Date();
  if(!days.has(today(d))) d.setDate(d.getDate()-1);
  while(days.has(today(d))){n++;d.setDate(d.getDate()-1);}
  return n;
}
function updateStreak(){ const el=$('#streak'), n=dayStreak(); el.lastChild.textContent=n; el.classList.toggle('on',n>0&&S.hist.some(x=>x.d===today())); el.title=`${n} dia${n===1?'':'s'} seguido${n===1?'':'s'}`; }
function chart14(){
  const days=[]; const d=new Date(); d.setDate(d.getDate()-13);
  for(let i=0;i<14;i++){days.push(today(d));d.setDate(d.getDate()+1);}
  const by=Object.fromEntries(days.map(k=>[k,{ok:0,bad:0}]));
  S.hist.forEach(x=>{if(by[x.d]) by[x.d][x.ok?'ok':'bad']++;});
  const maxV=Math.max(4,...days.map(k=>by[k].ok+by[k].bad));
  const top=Math.ceil(maxV/4)*4;
  const W=336,H=140,L=28,B=20,T=8, cw=(W-L)/14, ih=H-B-T, y=v=>T+ih-(v/top)*ih;
  const NS='http://www.w3.org/2000/svg';
  const s=(tag,a,txt)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e;};
  const svg=s('svg',{viewBox:`0 0 ${W} ${H}`,class:'chart',role:'img','aria-label':'Contas por dia nas últimas duas semanas'});
  [0,top/2,top].forEach(v=>{svg.append(s('line',{x1:L,x2:W,y1:y(v),y2:y(v),class:'grid'}));svg.append(s('text',{x:L-6,y:y(v)+3.5,'text-anchor':'end',class:'t'},v));});
  days.forEach((k,i)=>{
    const x=L+i*cw+cw*0.18, w=cw*0.64, o=by[k].ok, b=by[k].bad;
    if(o) svg.append(s('rect',{x,y:y(o),width:w,height:y(0)-y(o),class:'b-ok',rx:1.5}));
    if(b) svg.append(s('rect',{x,y:y(o+b),width:w,height:y(o)-y(o+b),class:'b-bad',rx:1.5}));
    if(i%2===1||i===13) svg.append(s('text',{x:x+w/2,y:H-5,'text-anchor':'middle',class:'t'},+k.slice(8)));
  });
  return svg;
}
function statRow(label,hs){
  const acc=hs.length?Math.round(hs.filter(x=>x.ok).length/hs.length*100)+'%':'—';
  const tm=hs.length?secs(hs.reduce((a,x)=>a+x.ms,0)/hs.length):'—';
  return h('tr',{},h('td',{},label),h('td',{class:'r num'},hs.length||'—'),h('td',{class:'r num'},acc),h('td',{class:'r num'},tm));
}
function viewPainel(){
  const H=S.hist, n=H.length, ok=H.filter(x=>x.ok).length;
  const total=ORDER.reduce((a,id)=>a+starsOf(id),0), done=ORDER.filter(id=>starsOf(id)>0).length;
  const kpis=h('div',{class:'kpis'},
    [[dayStreak(),'dias seguidos'],[fmt(S.xp.total),'XP no total'],[n?Math.round(ok/n*100)+'%':'—','de acerto'],[S.flash.level,`nível do flash (máx. ${S.flash.max})`]]
      .map(([v,l])=>h('div',{class:'kpi'},h('div',{class:'v'},v),h('div',{class:'l'},l))));
  const thead=(...cols)=>h('thead',{},h('tr',{},cols.map((c,k)=>h('th',{class:k?'r':null},c))));
  const typeRows=[['Soma e subtração','cadeia'],['Multiplicação','mul'],['Divisão','div'],['Ler e marcar',null]].map(([lab,t])=>statRow(lab,H.filter(x=>t?x.t===t:(x.t==='set'||x.t==='read'))));
  const unitRows=UNITS.map((U,k)=>{const st=U.nodes.reduce((a,id)=>a+starsOf(id),0);return h('tr',{},h('td',{},`${k+1}. ${U.t}`),h('td',{class:'r'},h('span',{class:'stars'},'★ '),h('span',{class:'num'},`${st}/${U.nodes.length*3}`)));});
  const fl=H.filter(x=>x.m==='flash').slice(-8).reverse();
  return h('div',{class:'stack'},
    kpis,
    n?h('div',{class:'card stack',style:'gap:8px'},h('p',{class:'eyebrow'},'Últimos 14 dias'),chart14(),
        h('div',{class:'legend'},h('span',{},h('i',{style:'background:var(--accent)'}),'acertos'),h('span',{},h('i',{style:'background:var(--bad);opacity:.6'}),'erros')))
     :h('div',{class:'card stack',style:'gap:10px'},h('p',{class:'h2'},'Ainda sem treino registrado'),h('p',{class:'muted'},'Faça a primeira etapa da trilha e o gráfico dos últimos 14 dias começa a encher. Tudo fica salvo só neste aparelho.'),h('button',{class:'btn',onclick:()=>{location.hash='trilha';}},'Ir para a trilha')),
    h('div',{class:'card stack',style:'gap:8px'},h('p',{class:'eyebrow'},`Trilha · ${done} de ${ORDER.length} etapas · ${total} estrelas`),
      h('table',{class:'tbl'},h('tbody',{},unitRows))),
    h('div',{class:'card stack',style:'gap:8px'},h('p',{class:'eyebrow'},'Por tipo de conta'),
      h('div',{class:'tbl-wrap'},h('table',{class:'tbl'},thead('Tipo','Contas','Acerto','Tempo'),h('tbody',{},typeRows)))),
    fl.length?h('div',{class:'card stack',style:'gap:8px'},h('p',{class:'eyebrow'},'Flash · últimas rodadas'),
      h('table',{class:'tbl'},h('tbody',{},fl.map(x=>h('tr',{},h('td',{},x.k==='livre'?'Livre':'Nível '+x.k.slice(1)),h('td',{class:'r num'},secs(x.ms)),h('td',{class:'r'},h('span',{class:'chip '+(x.ok?'ok':'bad')},x.ok?'Certo':'Errou'))))))):null);
}

/* ---------- navegação ---------- */
const VIEWS={trilha:viewTrilha,treino:viewTreino,soroban:viewSoroban,flash:viewFlash,painel:viewPainel,ajustes:viewAjustes};
const ALIAS={licoes:'trilha',contas:'trilha'};
let route='trilha';
const main=$('#main');
function render(){
  activeKp=null;
  document.querySelectorAll('.pop-back').forEach(x=>x.remove());
  main.replaceChildren(VIEWS[route]());
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-current',t.dataset.r===route?'page':'false'));
  $('#cfg').setAttribute('aria-pressed',String(route==='ajustes'));
}
function go(r){
  r=ALIAS[r]||r;
  if(!VIEWS[r]) r='trilha';
  if(route==='flash'&&r!=='flash') flashAbort();
  const changed=r!==route; route=r; render();
  if(changed) main.scrollTop=0;
  if(r==='trilha'&&!SESS.trilha) scrollToCurrent();
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  const r=t.dataset.r;
  if(r===route&&SESS[r]){SESS[r]=null;render();return;}
  if(location.hash==='#'+r) go(r); else location.hash=r;
}));
$('#syn').addEventListener('click',()=>setSyn(!S.syn));
$('#syn').setAttribute('aria-pressed',String(S.syn));
$('#cfg').addEventListener('click',()=>{ if(route==='ajustes') history.back(); else location.hash='ajustes'; });
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&(FL.state==='count'||FL.state==='show')){flashAbort();FL={state:'setup'};if(route==='flash')render();} });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.querySelectorAll('.pop-back').forEach(x=>x.remove()); });
updateStreak();
applyOrientation(false);
go(location.hash.slice(1));
})();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
